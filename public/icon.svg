<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="265" r="195" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />

  <!-- Robot Antenna Stem -->
  <rect x="246" y="85" width="20" height="60" rx="10" fill="#e2e8f0" />
  <!-- Robot Antenna Tip Energy Ball -->
  <circle cx="256" cy="85" r="28" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="248" cy="77" r="8" fill="#ffffff" opacity="0.7" />

  <!-- Robot Ears / Side Nodes -->
  <rect x="95" y="210" width="30" height="90" rx="14" fill="url(#goldGrad)" />
  <rect x="387" y="210" width="30" height="90" rx="14" fill="url(#goldGrad)" />

  <!-- Robot Head Outline / Shell -->
  <rect x="115" y="140" width="282" height="230" rx="55" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="4" />

  <!-- Visor / Face Screen -->
  <rect x="140" y="165" width="232" height="180" rx="36" fill="#090d16" stroke="#1e293b" stroke-width="4" />

  <!-- Cute Big Glowing Cyan Eyes -->
  <g filter="url(#glow)">
    <circle cx="205" cy="245" r="32" fill="#38bdf8" />
    <circle cx="307" cy="245" r="32" fill="#38bdf8" />
  </g>
  <!-- Eye highlights -->
  <circle cx="197" cy="237" r="10" fill="#ffffff" />
  <circle cx="299" cy="237" r="10" fill="#ffffff" />
  <circle cx="215" cy="255" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="317" cy="255" r="4" fill="#ffffff" opacity="0.8" />

  <!-- Cheerful Smile -->
  <path d="M 220 305 Q 256 332 292 305" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />

  <!-- Cute Cheeks -->
  <ellipse cx="170" cy="285" rx="14" ry="8" fill="#f43f5e" opacity="0.5" />
  <ellipse cx="342" cy="285" rx="14" ry="8" fill="#f43f5e" opacity="0.5" />

  <!-- Book badge at bottom -->
  <g transform="translate(196, 385)">
    <rect x="0" y="0" width="120" height="34" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" />
    <text x="60" y="22" font-family="sans-serif" font-size="14" font-weight="900" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">KELAS 7</text>
  </g>
</svg>
